<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link
			rel="icon"
			type="image/png"
			href="%sveltekit.assets%/favicon.ico" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1" />
		<title>
			Viking Egypt Cruise Itinerary - Travelers
		</title>
		<meta
			name="description"
			content="Easy-to-read Viking Egypt cruise itinerary for elderly travelers" />

		<!-- Bot prevention meta tags -->
		<meta
			name="robots"
			content="noindex, nofollow, noarchive, nosnippet, noimageindex, nocache" />
		<meta
			name="googlebot"
			content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
		<meta
			name="bingbot"
			content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
		<meta
			name="slurp"
			content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
		<meta
			name="duckduckbot"
			content="noindex, nofollow" />

		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="bg-cruise-cream text-gray-900">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
